name: Update deals

on:
  schedule:
    - cron: "*/5 * * * *"   # best-effort backup; cron-job.org calls workflow_dispatch every 5 minutes
  workflow_dispatch:
    inputs:
      test_push:
        description: Send a test notification to every connected device
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # a run stuck waiting on the Pages environment gets replaced by the next one

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install push library
        run: pip install --quiet -r requirements.txt
      - name: Fetch deals and send push notifications
        id: fetch
        env:
          STATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deals.json
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TEST_PUSH: ${{ inputs.test_push }}
        run: python3 fetch_deals.py
      # Skip the deploy when the deal list hasn't changed (the site is refreshed
      # at least every 10 minutes regardless, so its "updated" time stays honest).
      - if: steps.fetch.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/configure-pages@v5
      - if: steps.fetch.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        if: steps.fetch.outputs.changed == 'true' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
