name: Update deals

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's fastest schedule; runs can start a few minutes late
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch deals
        env:
          STATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deals.json
        run: python3 fetch_deals.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
