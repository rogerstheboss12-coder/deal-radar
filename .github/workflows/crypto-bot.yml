name: Crypto bot

on:
  push:
    paths: ["crypto-bot/**", ".github/workflows/crypto-bot.yml"]
  schedule:
    - cron: "7 0 * * *"   # daily, 7 minutes after the UTC daily candle closes (runs from the default branch only)
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [backtest, paper, live]
        default: backtest

permissions:
  contents: read

concurrency:
  group: crypto-bot-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a run that may be placing orders

defaults:
  run:
    working-directory: crypto-bot

jobs:
  backtest:
    if: github.event_name == 'push' || inputs.task == 'backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest -q
      - name: Backtest on real history
        run: python -m cryptobot backtest | tee backtest.json
      - name: Lottery test (all-in leveraged strategies, many start dates)
        run: python -m cryptobot lottery
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: |
            crypto-bot/backtest.json
            crypto-bot/lottery.json

  patterns:
    if: github.event_name == 'push' || inputs.task == 'backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: crypto-bot/data
          key: hourly-candles-${{ github.run_id }}
          restore-keys: hourly-candles-
      - name: Machine-learning pattern search (hourly, walk-forward, vs shuffled-label luck)
        run: python -m cryptobot patterns
      - uses: actions/upload-artifact@v4
        with:
          name: patterns
          path: crypto-bot/patterns.json

  trade:
    if: github.event_name == 'schedule' || inputs.task == 'paper' || inputs.task == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CRYPTOBOT_API_KEY: ${{ secrets.CRYPTOBOT_API_KEY }}
      CRYPTOBOT_API_SECRET: ${{ secrets.CRYPTOBOT_API_SECRET }}
      CRYPTOBOT_ALLOW_LIVE: ${{ vars.CRYPTOBOT_ALLOW_LIVE }}   # repo variable; "yes" = real orders
      CRYPTOBOT_HALT: ${{ vars.CRYPTOBOT_HALT }}               # repo variable; "yes" = stop trading
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt

      # The paper ledger and both circuit-breaker states live in the Actions cache between runs.
      - uses: actions/cache/restore@v4
        with:
          path: |
            crypto-bot/paper.json
            crypto-bot/guard-paper.json
            crypto-bot/guard-live.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-
      - name: Paper trade
        if: github.event_name == 'schedule' || inputs.task == 'paper'
        continue-on-error: true   # a paper-trading hiccup must not skip the live run
        run: python -m cryptobot trade --mode paper
      - name: Live trade
        if: (github.event_name == 'schedule' || inputs.task == 'live') && env.CRYPTOBOT_API_KEY != ''
        run: python -m cryptobot trade --mode live
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true   # nothing to save after a dry run
        with:
          path: |
            crypto-bot/paper.json
            crypto-bot/guard-paper.json
            crypto-bot/guard-live.json
          key: bot-state-${{ github.run_id }}
